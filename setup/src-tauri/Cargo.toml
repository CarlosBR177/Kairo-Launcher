[package]
name = "kairo-setup"
version = "0.1.4"
description = "Instalador do Kairo Launcher"
authors = ["Carlos"]
edition = "2021"

[lib]
name = "kairo_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
