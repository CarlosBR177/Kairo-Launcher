[package]
name = "kairo-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo do Kairo Launcher: contas, instalação do Minecraft/Fabric/Java, mods e inicialização"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
urlencoding = "2"
