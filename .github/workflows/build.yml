# Gera o instalador do Windows (.exe) com o mod do Kairo embutido.
#  - Actions → "Build Kairo" → Run workflow: gera o instalador como artefato.
#  - Criar uma tag (ex.: git tag v0.2.0 && git push --tags): publica uma Release no GitHub
#    com o instalador assinado e o latest.json, e o launcher de todo mundo se atualiza sozinho.
#
# Secrets (Settings → Secrets and variables → Actions):
#   KAIRO_MS_CLIENT_ID                  Client ID do Azure (login Microsoft)
#   KAIRO_DISCORD_APP_ID                Application ID do Discord (Rich Presence)
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo do arquivo kairo-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  senha da chave (vazio se não tiver)
name: Build Kairo

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 21 e 25 (1.21.x e 26.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Compila um jar por versão do Minecraft (Stonecutter): versions/<versão>/build/libs
      - name: Compilar o mod Kairo Client (todas as versões)
        working-directory: mod
        run: ./gradlew.bat build --no-daemon

      # TEMPORÁRIO: mostra as assinaturas da 26.3 usadas pelas telas do Kairo (roda mesmo se o build falhar)
      - name: Diagnóstico 26.3
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Recurse -Filter minecraft-client.jar -ErrorAction SilentlyContinue "$env:USERPROFILE/.gradle/caches/fabric-loom" |
            Where-Object { $_.FullName -match '26\.3' } | Select-Object -First 1
          if (-not $jar) { "minecraft-client.jar da 26.3 não encontrado"; exit 0 }
          "== $($jar.FullName)"
          $checks = [ordered]@{
            'net.minecraft.client.gui.screens.ConnectScreen' = 'startConnecting'
            'net.minecraft.client.gui.screens.PauseScreen' = 'PauseScreen\(|showsPauseMenu'
            'net.minecraft.client.gui.screens.TitleScreen' = 'TitleScreen\('
            'net.minecraft.client.gui.screens.Screen' = ' font;| minecraft;|extractRenderState|keyPressed|mouseClicked|children\(|rebuildWidgets|shouldCloseOnEsc'
            'net.minecraft.client.multiplayer.ServerList' = 'ServerList\(|load\(|size\(|get\('
            'net.minecraft.client.multiplayer.ServerData' = ' name;| ip;'
            'net.minecraft.client.gui.screens.options.OptionsScreen' = 'OptionsScreen\('
            'net.minecraft.client.gui.screens.worldselection.SelectWorldScreen' = 'SelectWorldScreen\('
            'net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen' = 'JoinMultiplayerScreen\('
            'net.minecraft.client.input.KeyEvent' = 'KeyEvent\(|key\(\)'
            'com.mojang.blaze3d.platform.InputConstants' = 'getKey|KEY_ESCAPE|KEY_RETURN'
            'net.minecraft.client.gui.components.AbstractButton' = 'onPress'
            'net.minecraft.client.resources.sounds.SimpleSoundInstance' = 'forUI'
            'net.minecraft.client.KeyMapping' = 'setKey|resetMapping|getTranslatedKeyMessage'
            'net.minecraft.client.Minecraft' = 'getCurrentServer|isLocalServer|hasSingleplayerServer|getSingleplayerServer|getFps|getUser|void stop|getSoundManager| options;'
          }
          foreach ($c in $checks.Keys) {
            "--- $c"
            $out = javap -p -cp $jar.FullName $c 2>&1
            if ($LASTEXITCODE -ne 0) { "  (classe não existe)"; continue }
            $out | Select-String -Pattern $checks[$c] | ForEach-Object { "  " + $_.Line.Trim() }
          }

      - name: Embutir os jars no launcher
        shell: pwsh
        run: |
          Get-ChildItem mod/versions/*/build/libs/kairo-client-*.jar |
            Where-Object { $_.Name -notlike '*-sources.jar' -and $_.Name -notlike '*-dev.jar' } |
            Copy-Item -Destination launcher/src-tauri/resources/
          Get-ChildItem launcher/src-tauri/resources/

      - name: Apontar o auto-update para este repositório
        shell: pwsh
        run: |
          $conf = "launcher/src-tauri/tauri.conf.json"
          (Get-Content $conf -Raw).Replace("SEU_USUARIO/SEU_REPO", "${{ github.repository }}") | Set-Content $conf -NoNewline

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            launcher/package-lock.json
            setup/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher/src-tauri
            launcher/core
            setup/src-tauri

      - name: Testes do núcleo
        working-directory: launcher/core
        run: cargo test

      - name: Instalar dependências
        working-directory: launcher
        run: npm ci

      # Execução manual: instalador como artefato (assinado se a chave existir)
      - name: Gerar instalador
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: launcher
        shell: pwsh
        env:
          KAIRO_MS_CLIENT_ID: ${{ secrets.KAIRO_MS_CLIENT_ID }}
          KAIRO_DISCORD_APP_ID: ${{ secrets.KAIRO_DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { npx tauri build --config src-tauri/tauri.updater.conf.json }
          else { npx tauri build }

      # Kairo Setup: instalador com o visual do Kairo, que roda o NSIS acima em silêncio
      - name: Kairo Setup
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: setup
        shell: pwsh
        run: |
          $nsis = Get-ChildItem ../launcher/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $env:KAIRO_NSIS_PATH = $nsis.FullName
          npm ci
          npx tauri build --no-bundle
          Copy-Item src-tauri/target/release/kairo-setup.exe ../Kairo-Setup.exe

      - uses: actions/upload-artifact@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Kairo-Launcher-Windows
          path: |
            Kairo-Setup.exe
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            mod/versions/*/build/libs/kairo-client-*.jar

      # Novidades da versão: o texto de RELEASE_NOTES.md vira a descrição da release
      # e as "notes" do latest.json (é o que aparece na janela de atualização do launcher).
      - name: Notas da versão
        id: notes
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $body = if (Test-Path RELEASE_NOTES.md) { (Get-Content RELEASE_NOTES.md -Raw -Encoding UTF8).Trim() } else { "Melhorias e correções." }
          $body += "`n`n**Primeira vez?** Baixe o ``Kairo-Setup.exe`` abaixo. Quem já tem o launcher recebe a atualização sozinho."
          $d = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$d`n$body`n$d" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Tag v*: Release no GitHub com latest.json (o que o auto-update lê)
      - name: Publicar release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KAIRO_MS_CLIENT_ID: ${{ secrets.KAIRO_MS_CLIENT_ID }}
          KAIRO_DISCORD_APP_ID: ${{ secrets.KAIRO_DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Kairo ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.updater.conf.json

      # Release: anexa o Kairo-Setup.exe (o que os jogadores baixam).
      # O instalador NSIS continua na release porque é ele que o auto-update usa.
      - name: Kairo Setup (release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = Get-ChildItem ../launcher/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $env:KAIRO_NSIS_PATH = $nsis.FullName
          npm ci
          npx tauri build --no-bundle
          Copy-Item src-tauri/target/release/kairo-setup.exe ../Kairo-Setup.exe
          gh release upload "${{ github.ref_name }}" ../Kairo-Setup.exe --clobber
